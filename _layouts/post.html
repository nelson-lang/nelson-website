---
layout: default
---
<main class="page-main">
  <article class="post">
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {{ content }}
    <p class="post-back"><a href="{{ '/news.html' | relative_url }}">Back to all news</a></p>
  </article>
</main>
